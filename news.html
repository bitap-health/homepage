<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fbf7f5">
  <meta name="description" content="株式会社BitaPのお知らせ。事業事例、メディア出演、登壇・受賞などの最新情報をお届けします。">
  <link rel="canonical" href="https://bitap.co.jp/news.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="お知らせ | 株式会社BitaP">
  <meta property="og:description" content="株式会社BitaPのお知らせ。事業事例、メディア出演、登壇・受賞などの最新情報をお届けします。">
  <meta property="og:url" content="https://bitap.co.jp/news.html">
  <meta property="og:image" content="https://bitap.co.jp/images/bitap_logo.png">
  <meta property="og:site_name" content="株式会社BitaP">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <title>お知らせ | 株式会社BitaP</title>
  <link rel="stylesheet" href="style.css">
<script src="nav.js"></script>
</head>
<body>

  <header>
    <nav>
      <a class="brand" href="index.html"><b>株式会社BitaP</b><small class="en">BITAP INC.</small></a>
      <ul class="nav-links">
        <li><a href="index.html#service">事業内容<span class="en">SERVICE</span></a></li>
        <li><a href="index.html#record">実績<span class="en">RECORD</span></a></li>
        <li><a href="index.html#news">お知らせ<span class="en">JOURNAL</span></a></li>
        <li><a href="index.html#story">BitaPについて<span class="en">ABOUT</span></a></li>
        <li><a href="index.html#contact">お問い合わせ<span class="en">CONTACT</span></a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="page-header">
      <div class="wrap">
        <h1>お知らせ</h1>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div id="news-filter" class="tag-filter" role="group" aria-label="記事の種類でしぼり込む" hidden></div>
        <p id="news-count" class="news-count" hidden></p>
        <div id="news-grid" class="news-grid">読み込み中...</div>
      </div>
    </section>

  </main>

  <footer>
    <div class="wrap">
      <p class="en" style="font-size:1rem;color:var(--ink)">BITAP INC.</p>
      <p class="fnav">
        <a href="index.html#service">事業内容</a>｜<a href="index.html#record">実績</a>｜<a href="news.html">お知らせ</a>｜<a href="privacy.html">プライバシーポリシー</a>
      </p>
      <p>Mail：<a href="mailto:info@bitap.co.jp">info@bitap.co.jp</a></p>
      <p style="margin-top:1rem">© 2025 株式会社BitaP</p>
    </div>
  </footer>

  <script>
  /* お知らせの読み込みと、タグでの絞り込み */

  /* バーに並べる順番。ここに無いタグは末尾に回る */
  const TAG_ORDER = ['事業事例', '登壇情報', 'メディア出演', '受賞', '採択',
                     'クラファン', '開催報告', '会社情報', '御礼'];
  const ALL = 'すべて';

  const grid = document.getElementById('news-grid');
  const bar = document.getElementById('news-filter');
  const count = document.getElementById('news-count');

  let items = [];
  let active = new URLSearchParams(location.search).get('tag') || ALL;

  const card = it => `
          <a class="news-card" href="${it.link}">
            <div class="thumb">${it.image ? `<img src="${it.image}" alt="" class="${it.fit === 'contain' ? 'fit-contain' : ''}" loading="lazy" decoding="async" onload="this.classList.add('is-loaded')">` : ''}</div>
            ${(it.tags || []).length ? `<div class="tags">${it.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
            <p class="date en">${it.date}</p>
            <p class="t">${it.title}</p>
          </a>`;

  /* 記事に実際に付いているタグだけを、TAG_ORDER の順に並べて返す */
  const usedTags = () => {
    const found = [];
    items.forEach(it => (it.tags || []).forEach(t => { if (!found.includes(t)) found.push(t); }));
    return found.sort((a, b) => {
      const ia = TAG_ORDER.indexOf(a), ib = TAG_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  };

  const render = () => {
    const tags = usedTags();
    if (!tags.includes(active)) active = ALL;

    bar.innerHTML = [ALL, ...tags]
      .map(t => `<button type="button" aria-pressed="${t === active}">${t}</button>`).join('');
    bar.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        active = b.textContent;
        /* 絞り込んだ状態のURLを共有・ブックマークできるようにする */
        const url = active === ALL ? location.pathname
                                   : location.pathname + '?tag=' + encodeURIComponent(active);
        history.replaceState(null, '', url);
        render();
      });
    });
    bar.hidden = false;

    /* スマホでは横1行で送る形なので、選ばれているタグが画面外だと分からない。
       バーの中だけを動かして中央に寄せる（ページ自体はスクロールさせない） */
    const 選択中 = bar.querySelector('[aria-pressed="true"]');
    if (選択中 && bar.scrollWidth > bar.clientWidth) {
      bar.scrollLeft = 選択中.offsetLeft - (bar.clientWidth - 選択中.offsetWidth) / 2;
    }

    const list = active === ALL ? items : items.filter(it => (it.tags || []).includes(active));
    count.textContent = `${list.length}件`;
    count.hidden = false;
    grid.innerHTML = list.map(card).join('');
  };

  fetch('news.json?v=' + Date.now())
    .then(r => r.json())
    .then(d => { items = d.filter(it => it.public !== false); render(); })
    .catch(() => { grid.textContent = 'お知らせを読み込めませんでした。'; });
  </script>

</body>
</html>
